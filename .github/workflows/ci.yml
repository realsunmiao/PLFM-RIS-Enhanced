name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest

      - name: Run unit tests
        run: pytest -v

      - name: Run simulation end-to-end (headless)
        run: |
          cd 6_Simulation
          MPLBACKEND=Agg python stc_simulation.py
          test -f stc_simulation_result.png

      - name: Verify committed dataset is reproducible
        run: |
          cd 6_Simulation
          python - <<'EOF'
          import csv, json, os
          with open("dataset/summary.csv", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          with open("dataset/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          assert len(rows) >= 40, "dataset too small"
          assert manifest["num_scenes"] == len(rows), "manifest/csv mismatch"
          print(f"dataset OK: {len(rows)} scenes, "
                f"success_rate={manifest['success_rate']}")
          EOF
